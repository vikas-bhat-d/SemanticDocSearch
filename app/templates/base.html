<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DocSearch indexer{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
        <symbol id="icon-brand" viewBox="0 0 24 24">
            <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H14l6 6v7.5A2.5 2.5 0 0 1 17.5 18h-11A2.5 2.5 0 0 1 4 15.5z" />
            <path d="M14 2v6h6M8 12h5" />
            <circle cx="15.5" cy="14.5" r="2.5" />
            <path d="m17.3 16.3 2 2" />
        </symbol>
        <symbol id="icon-dashboard" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
        </symbol>
        <symbol id="icon-folder" viewBox="0 0 24 24">
            <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z" />
            <path d="M3.5 10h17" />
        </symbol>
        <symbol id="icon-file-settings" viewBox="0 0 24 24">
            <path d="M5 3.5A1.5 1.5 0 0 1 6.5 2H14l5 5v5" />
            <path d="M14 2v5h5M5 3.5v17A1.5 1.5 0 0 0 6.5 22H12" />
            <path d="M15.5 15.5h5M18 13v5M16.2 13.8l3.6 3.6M19.8 13.8l-3.6 3.6" />
        </symbol>
        <symbol id="icon-ban" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" />
            <path d="m5.6 5.6 12.8 12.8" />
        </symbol>
        <symbol id="icon-building" viewBox="0 0 24 24">
            <path d="M4 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M2 21h20M8 7h4M8 11h4M8 15h4M20 21v-9a1 1 0 0 0-1-1h-2" />
        </symbol>
        <symbol id="icon-file-text" viewBox="0 0 24 24">
            <path d="M5 3.5A1.5 1.5 0 0 1 6.5 2H14l5 5v13.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20.5z" />
            <path d="M14 2v5h5M8 12h8M8 16h6" />
        </symbol>
        <symbol id="icon-languages" viewBox="0 0 24 24">
            <path d="M4 5h8M8 3v2a9 9 0 0 1-4 7M5 8a9 9 0 0 0 6 4M14 5h7M17.5 5v1.5A13 13 0 0 1 13 17M15 11h5M13 21l4.5-10L22 21M14.5 18h6" />
        </symbol>
        <symbol id="icon-refresh" viewBox="0 0 24 24">
            <path d="M20 11a8 8 0 0 0-14.7-4L3 10" />
            <path d="M3 4v6h6M4 13a8 8 0 0 0 14.7 4L21 14" />
            <path d="M21 20v-6h-6" />
        </symbol>
        <symbol id="icon-sliders" viewBox="0 0 24 24">
            <path d="M4 6h16M4 12h16M4 18h16" />
            <circle cx="9" cy="6" r="2" fill="currentColor" stroke="none" />
            <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none" />
            <circle cx="10" cy="18" r="2" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="icon-scroll" viewBox="0 0 24 24">
            <path d="M7 4h12v15a2 2 0 0 1-2 2H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h12" />
            <path d="M7 3v17M11 8h5M11 12h5M11 16h3" />
        </symbol>
        <symbol id="icon-log-out" viewBox="0 0 24 24">
            <path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M15 16l4-4-4-4M9 12h10" />
        </symbol>
        <symbol id="icon-play" viewBox="0 0 24 24">
            <path d="m8 5 11 7-11 7z" />
        </symbol>
        <symbol id="icon-square" viewBox="0 0 24 24">
            <rect x="5" y="5" width="14" height="14" rx="2" />
        </symbol>
        <symbol id="icon-check-circle" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" />
            <path d="m8 12 2.5 2.5L16 9" />
        </symbol>
        <symbol id="icon-skip" viewBox="0 0 24 24">
            <path d="m5 5 9 7-9 7zM19 5v14" />
        </symbol>
        <symbol id="icon-x-circle" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" />
            <path d="m9 9 6 6M15 9l-6 6" />
        </symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24">
            <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
        </symbol>
        <symbol id="icon-alert" viewBox="0 0 24 24">
            <path d="m12 3 9 17H3zM12 9v5M12 17h.01" />
        </symbol>
        <symbol id="icon-key" viewBox="0 0 24 24">
            <circle cx="8" cy="15" r="4" />
            <path d="m11 12 8-8M16 7l2 2M14 9l2 2" />
        </symbol>
        <symbol id="icon-save" viewBox="0 0 24 24">
            <path d="M5 3h12l2 2v16H5zM8 3v6h8V3M8 21v-7h8v7" />
        </symbol>
        <symbol id="icon-search" viewBox="0 0 24 24">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m16 16 5 5" />
        </symbol>
        <symbol id="icon-pause" viewBox="0 0 24 24">
            <path d="M8 5v14M16 5v14" />
        </symbol>
        <symbol id="icon-eraser" viewBox="0 0 24 24">
            <path d="m7 19 11-11a2 2 0 0 0 0-3l-1-1a2 2 0 0 0-3 0L3 15l4 4zM3 21h18M12 10l4 4" />
        </symbol>
        <symbol id="icon-download" viewBox="0 0 24 24">
            <path d="M12 3v12M7 10l5 5 5-5M5 21h14" />
        </symbol>
        <symbol id="icon-edit" viewBox="0 0 24 24">
            <path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16zM13.5 6.5l4 4" />
        </symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14" />
        </symbol>
    </svg>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <svg class="ui-icon" aria-hidden="true"><use href="#icon-brand"></use></svg>
                </div>
                <div class="brand-text">
                    <h2>DocSearch</h2>
                    <span>indexer</span>
                </div>
            </div>

            <nav class="nav-menu">
                <a href="/" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                    <svg class="ui-icon" aria-hidden="true"><use href="#icon-dashboard"></use></svg> Dashboard
                </a>
                <a href="/folders" class="nav-item {% if active_page == 'folders' %}active{% endif %}">
                    <svg class="ui-icon" aria-hidden="true"><use href="#icon-folder"></use></svg> Index Folders
                </a>
                <a href="/file-types" class="nav-item {% if active_page == 'file_types' %}active{% endif %}">
                    <svg class="ui-icon" aria-hidden="true"><use href="#icon-file-settings"></use></svg> File Types
                </a>
                <a href="/exclusions" class="nav-item {% if active_page == 'exclusions' %}active{% endif %}">
                    <svg class="ui-icon" aria-hidden="true"><use href="#icon-ban"></use></svg> Exclusions
                </a>
                <a href="/departments" class="nav-item {% if active_page == 'departments' %}active{% endif %}">
                    <svg class="ui-icon" aria-hidden="true"><use href="#icon-building"></use></svg> Departments
                </a>
                <a href="/doc-types" class="nav-item {% if active_page == 'doctypes' %}active{% endif %}">
                    <svg class="ui-icon" aria-hidden="true"><use href="#icon-file-text"></use></svg> Doc Types
                </a>
                <a href="/synonyms" class="nav-item {% if active_page == 'synonyms' %}active{% endif %}">
                    <svg class="ui-icon" aria-hidden="true"><use href="#icon-languages"></use></svg> Synonyms
                </a>
                <a href="/incremental" class="nav-item {% if active_page == 'incremental' %}active{% endif %}">
                    <svg class="ui-icon" aria-hidden="true"><use href="#icon-refresh"></use></svg> Incremental XML
                </a>
                <a href="/settings" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
                    <svg class="ui-icon" aria-hidden="true"><use href="#icon-sliders"></use></svg> Settings
                </a>
                <a href="/logs" class="nav-item {% if active_page == 'logs' %}active{% endif %}">
                    <svg class="ui-icon" aria-hidden="true"><use href="#icon-scroll"></use></svg> Live Logs
                </a>
            </nav>

            <div class="sidebar-footer">
                <form action="/api/auth/logout" method="POST">
                    <button type="submit" class="logout-btn">
                        <svg class="ui-icon" aria-hidden="true"><use href="#icon-log-out"></use></svg> Logout
                    </button>
                </form>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <main class="main-content">
            <header class="top-header">
                <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
                <div class="user-badge">
                    <span class="dot online"></span> Admin
                </div>
            </header>

            <div class="content-body">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
